# git-cliff 配置：按约定式提交（feat: / fix: / docs: …）把两个版本之间的提交整理成 changelog。
# 发版 Action 用它生成 Release 说明；本地可运行 `npx git-cliff -o CHANGELOG.md` 生成完整 changelog。

[changelog]
header = "# Changelog\n"
body = """
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/sheepbox8646/cloud-pvz/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# 每个提交只取标题行作为一条
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|ci|build|style)", group = "<!-- 6 -->Maintenance" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
