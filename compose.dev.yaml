# 本地开发用的 S3（MinIO）。启动：docker compose -f compose.dev.yaml up -d
# API: http://localhost:9100   控制台: http://localhost:9101（账号密码见下）
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: cloudpvz
      MINIO_ROOT_PASSWORD: cloudpvz-dev-secret
    volumes:
      - minio-data:/data

  # 首次启动时创建存档桶
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 cloudpvz cloudpvz-dev-secret >/dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing local/cloud-pvz-saves"

volumes:
  minio-data:
