<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud PvZ player</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #canvas-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #canvas-container:fullscreen { width: 100%; height: 100%; }
  canvas#canvas { display: block; outline: none; }
  canvas#canvas[data-scale="integer"] { image-rendering: pixelated; }
  #pvz-soft-keyboard {
    position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding: 0; border: 0;
    opacity: 0; resize: none; pointer-events: none; font-size: 16px;
  }
</style>
</head>
<body>
  <!-- id 由引擎约定：#canvas-container 是游戏内全屏的目标，#pvz-soft-keyboard 用于软键盘输入 -->
  <div id="canvas-container">
    <canvas id="canvas" width="800" height="600" tabindex="0"></canvas>
  </div>
  <textarea id="pvz-soft-keyboard" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done"></textarea>
  <script type="module" src="/src/player/main.ts"></script>
</body>
</html>
