# 推送 v 开头的 tag（如 v0.2.0）时：用 git-cliff 按约定式提交生成本次的 changelog，
# 创建 GitHub Release，然后调用部署工作流把这个版本部署到 Cloudflare。
# tag 带连字符（如 v0.2.0-beta.1）时标记为预发布。

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md --verify-tag "${flags[@]}"

  # 用 GITHUB_TOKEN 创建的 Release 不会再触发 release 事件，所以这里直接调用部署工作流
  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
